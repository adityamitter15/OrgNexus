{% extends "base.html" %}
{% block title %}New meeting{% endblock %}

{% block content %}
<h1 class="h3 mb-3">New meeting</h1>

<form method="post" class="on-card">
    {% csrf_token %}
    <div class="row g-3">
        {% for field in form %}
            <div class="col-md-6">
                <label class="form-label">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <div class="text-danger small">{{ field.errors|striptags }}</div>
                {% endif %}
            </div>
        {% endfor %}
    </div>
    <div class="mt-3">
        <button type="submit" class="btn btn-on">Save</button>
        <a href="{% url 'scheduler:upcoming' %}" class="btn btn-link">Cancel</a>
    </div>
</form>
{% endblock %}
