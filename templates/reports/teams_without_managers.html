{% extends "base.html" %}
{% block title %}Teams without managers{% endblock %}

{% block content %}
<h1 class="h3">Teams without managers</h1>

{% if teams %}
    <div class="on-card">
        <table class="on-table w-100">
            <thead><tr><th>Team</th><th>Department</th></tr></thead>
            <tbody>
                {% for t in teams %}
                    <tr>
                        <td><a href="{% url 'teams:detail' t.slug %}">{{ t.name }}</a></td>
                        <td>{{ t.department.name }}</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
{% else %}
    <div class="on-card text-center py-4">
        <p class="text-muted mb-0">Every team has a manager. Nice.</p>
    </div>
{% endif %}
{% endblock %}
