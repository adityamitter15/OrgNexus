{% extends "base.html" %}
{% block title %}New message{% endblock %}

{% block content %}
<h1 class="h3 mb-3">New message</h1>

<form method="post" class="on-card">
    {% csrf_token %}
    <div class="mb-3">
        <label class="form-label">To</label>
        {{ form.recipients }}
    </div>
    <div class="mb-3">
        <label class="form-label">Subject</label>
        {{ form.subject }}
        {% if form.subject.errors %}
            <div class="text-danger small">{{ form.subject.errors|striptags }}</div>
        {% endif %}
    </div>
    <div class="mb-3">
        <label class="form-label">Message</label>
        {{ form.body }}
    </div>
    <div class="d-flex gap-2">
        <button type="submit" name="action" value="send" class="btn btn-on">Send</button>
        <button type="submit" name="action" value="draft" class="btn btn-on-outline">
            Save as draft
        </button>
        <a class="btn btn-link" href="{% url 'messaging:inbox' %}">Cancel</a>
    </div>
</form>
{% endblock %}
