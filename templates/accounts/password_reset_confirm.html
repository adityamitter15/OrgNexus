{% extends "base.html" %}
{% block content %}
<div class="on-auth-card">
    {% if validlink %}
        <h1>Set a new password</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-on w-100">Save new password</button>
        </form>
    {% else %}
        <h1>Link expired</h1>
        <p class="text-muted">
            That reset link is no longer valid. Request a new one.
        </p>
        <a class="btn btn-on" href="{% url 'accounts:password_reset' %}">
            Request a new link
        </a>
    {% endif %}
</div>
{% endblock %}
