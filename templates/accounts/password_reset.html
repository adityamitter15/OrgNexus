{% extends "base.html" %}
{% block content %}
<div class="on-auth-card">
    <h1>Reset password</h1>
    <p class="text-muted">
        We'll email a one-time link to the address on your account.
    </p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-on w-100">Send reset link</button>
    </form>
</div>
{% endblock %}
