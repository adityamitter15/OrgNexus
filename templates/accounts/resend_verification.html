{% extends "base.html" %}
{% block content %}
<div class="on-auth-card">
    <h1>Resend verification email</h1>
    <p class="text-muted">
        Enter the email tied to your account and we'll send a fresh link.
    </p>
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label" for="email-input">Email</label>
            <input id="email-input" name="email" type="email"
                   class="form-control" required>
        </div>
        <button type="submit" class="btn btn-on w-100">Resend link</button>
    </form>

    {% if debug %}
        <div class="alert alert-info small mt-3 mb-0">
            <strong>Dev mode:</strong> emails are saved to a local file
            outbox. <a href="{% url 'accounts:dev_outbox' %}">Open outbox</a>
            to grab the verification link.
        </div>
    {% endif %}
</div>
{% endblock %}
