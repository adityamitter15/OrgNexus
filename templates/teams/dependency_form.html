{% extends "base.html" %}
{% block title %}New dependency{% endblock %}

{% block content %}
<div class="on-auth-card">
    <h1>Add dependency</h1>
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
            <div class="mb-3">
                <label class="form-label">{{ field.label }}</label>
                {{ field }}
                {% if field.errors %}
                    <div class="form-text text-danger">{{ field.errors|striptags }}</div>
                {% endif %}
            </div>
        {% endfor %}
        <button type="submit" class="btn btn-on">Save dependency</button>
    </form>
</div>
{% endblock %}
