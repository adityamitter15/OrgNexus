<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="OrgNexus logo">
    <!-- Soft outer circle - same lavender-blue as the CW1 mockups. -->
    <defs>
        <linearGradient id="onLogoBg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#e6eef9"/>
            <stop offset="100%" stop-color="#cfdcef"/>
        </linearGradient>
    </defs>
    <circle cx="32" cy="32" r="30" fill="url(#onLogoBg)" stroke="#1b4965" stroke-width="1.4"/>

    <!-- Connection lines from centre to six outer nodes (hexagonal). -->
    <g stroke="#1b4965" stroke-width="1.6" stroke-linecap="round" opacity=".75">
        <line x1="32" y1="32" x2="32" y2="14"/>
        <line x1="32" y1="32" x2="48" y2="22"/>
        <line x1="32" y1="32" x2="48" y2="42"/>
        <line x1="32" y1="32" x2="32" y2="50"/>
        <line x1="32" y1="32" x2="16" y2="42"/>
        <line x1="32" y1="32" x2="16" y2="22"/>
    </g>

    <!-- Centre node + six outer nodes (slightly smaller). -->
    <g fill="#1b4965">
        <circle cx="32" cy="32" r="4.2"/>
        <circle cx="32" cy="14" r="2.8"/>
        <circle cx="48" cy="22" r="2.8"/>
        <circle cx="48" cy="42" r="2.8"/>
        <circle cx="32" cy="50" r="2.8"/>
        <circle cx="16" cy="42" r="2.8"/>
        <circle cx="16" cy="22" r="2.8"/>
    </g>
</svg>
